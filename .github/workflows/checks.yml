name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-recovery:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify native service policy on a disposable fixture
        shell: powershell
        env:
          TELYND_DISPOSABLE_WINDOWS: '1'
        run: ./tests/windows-policy.ps1
      - name: Verify the same lifecycle under PowerShell 7
        shell: pwsh
        env:
          TELYND_DISPOSABLE_WINDOWS: '1'
        run: ./tests/windows-policy.ps1

  recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check shell syntax
        run: |
          for script in scripts/*.sh scripts/*.command tests/*.sh build.sh; do
            bash -n "$script"
          done
      - name: Verify the desktop setup helper on a disposable Linux runner
        timeout-minutes: 6
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk pkexec xvfb
          dpkg-deb --info assets/telynd-setup_0.2.0_all.deb
          sudo dpkg -i assets/telynd-setup_0.2.0_all.deb
          # Exercise the missing-server path on this disposable runner too.
          sudo apt-get remove -y openssh-server
          test ! -x /usr/sbin/sshd
          sudo /usr/lib/telynd-setup/prepare-ssh
          systemctl is-active ssh.service || systemctl is-active ssh.socket
          ssh-keyscan -T 5 -t ed25519 127.0.0.1 > /tmp/telynd-ci-host-key
          test -s /tmp/telynd-ci-host-key
          xvfb-run -a python3 -m unittest discover -s tests -p test_linux_helper.py -v
      - name: Exercise recovery decisions and locking
        run: python3 -m unittest discover -s tests -v

      - name: Reject unsafe Linux directory ancestors
        run: sudo env TELYND_DISPOSABLE_LINUX=1 bash tests/linux-path-security.sh
      - name: Verify public-key authorisation in a disposable account
        run: sudo env TELYND_DISPOSABLE_LINUX=1 bash tests/linux-authorisation.sh
      - name: Verify installation on disposable systemd runner
        run: sudo env TELYND_DISPOSABLE_LINUX=1 bash tests/linux-integration.sh

  mac-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Exercise configuration and readiness boundaries
        run: swift test
      - name: Exercise key authorisation and SSH parsing
        run: |
          python3 -m unittest discover -s tests -p test_authorisation.py -v
          python3 -m unittest discover -s tests -p test_ssh_policy.py -v
      - name: Exercise isolated macOS recovery lifecycle
        run: python3 -m unittest discover -s tests -p test_macos_recovery.py -v
      - name: Exercise native launchd with a synthetic host
        timeout-minutes: 2
        env:
          TELYND_DISPOSABLE_MACOS: '1'
        run: bash tests/macos-launchd.sh
      - name: Build and verify app bundle
        run: bash build.sh
      - name: Validate signing transport without credentials
        run: |
          ditto --norsrc --noextattr -c -k --keepParent build/Telynd.app build/release-input.zip
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/Telynd.app/Contents/Info.plist)
          python3 scripts/prepare_release_input.py build/release-input.zip build/signing-input --tag "v$version" --revision "$GITHUB_SHA"
          codesign --verify --deep --strict build/signing-input/Telynd.app
